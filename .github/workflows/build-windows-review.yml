name: Verify Windows review build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: windows-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows:
    runs-on: windows-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_DEMO_MODE: "false"
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run desktop packaging tests
        run: npm run test:desktop-pack

      - name: Build Windows desktop app
        run: npm run desktop:dist:win

      - name: Upload Windows review ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fortified-command-center-windows-review
          path: dist-desktop/Fortified Command Center-0.1.0-win-x64.zip
          if-no-files-found: error
          compression-level: 0
