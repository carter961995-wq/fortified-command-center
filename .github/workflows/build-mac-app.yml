name: Build Mac desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_DEMO_MODE: "true"
      REQUIRE_MAC_SIGNING: "true"
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Mac app
        run: |
          set -euo pipefail

          if node scripts/verify-mac-signing-env.mjs; then
            echo "signed_build=1" >> "$GITHUB_ENV"
            npm run desktop:dist
          else
            echo "signed_build=0" >> "$GITHUB_ENV"
            echo "Mac signing credentials are incomplete; building unsigned desktop artifacts."
            echo "Unsigned artifacts may require right-click > Open on macOS and should not be used for public distribution."
            unset REQUIRE_MAC_SIGNING
            unset CSC_LINK CSC_NAME CSC_KEY_PASSWORD
            unset MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_ID_PASSWORD APPLE_TEAM_ID
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_ISSUER_ID
            npm run desktop:dist:unsigned
          fi

      - name: Verify Mac app bundle
        run: |
          set -euo pipefail

          verified=0
          for app in dist-desktop/mac*/Fortified\ Command\ Center.app dist-desktop/mac/Fortified\ Command\ Center.app; do
            if [ -d "$app" ]; then
              if [ "$signed_build" = "1" ]; then
                codesign --verify --deep --strict --verbose=2 "$app"
                spctl --assess --type execute --verbose=4 "$app"
              else
                echo "Skipping Gatekeeper verification for unsigned app bundle: $app"
              fi
              verified=1
            fi
          done

          if [ "$verified" -ne 1 ]; then
            echo "No packaged .app bundle found to verify."
            exit 1
          fi

      - name: Prepare Codemagic-friendly Mac artifacts
        run: |
          set -euo pipefail
          chmod +x scripts/prepare-mac-codemagic-artifacts.sh
          ./scripts/prepare-mac-codemagic-artifacts.sh

      - name: Upload Mac download artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fortified-command-center-mac
          path: |
            dist-desktop/*.zip
            dist-desktop/*.dmg
            dist-desktop/HOW_TO_OPEN_MAC_BUILD.txt
