name: Build Mac desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Mac app
        run: npm run desktop:dist

      - name: Upload Mac download artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fortified-command-center-mac
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
