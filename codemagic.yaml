workflows:
  web-app:
    name: Fortified Command Center Web Build
    instance_type: linux_x2
    max_build_duration: 30

    environment:
      node: 22
      vars:
        NEXT_TELEMETRY_DISABLED: "1"
        # Add the Supabase values from .env.example as secure Codemagic
        # environment variables before running this workflow:
        # NEXT_PUBLIC_SUPABASE_URL
        # NEXT_PUBLIC_SUPABASE_ANON_KEY
        # SUPABASE_SERVICE_ROLE_KEY

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: cursor/*
          include: true
          source: true

    cache:
      cache_paths:
        - ~/.npm
        - .next/cache

    scripts:
      - name: Install dependencies and build web app
        script: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            echo "No package.json found in this checkout; nothing to build yet."
            exit 0
          fi

          node --version
          npm --version

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          npm run build

    artifacts:
      - .next/**
      - out/**
      - build/**
      - dist/**

  mac-desktop-app:
    name: Fortified Command Center Mac Download
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: 22
      groups:
        - mac_desktop_signing
      vars:
        NEXT_TELEMETRY_DISABLED: "1"
        NEXT_PUBLIC_DEMO_MODE: "true"
        # Add these values to the mac_desktop_signing secure environment group
        # when you want signed and notarized public downloads. If they are absent,
        # this workflow still produces unsigned development downloads.
        # CSC_LINK (Developer ID Application .p12 as base64 or secure file URL)
        # CSC_KEY_PASSWORD
        # APPLE_ID
        # APPLE_APP_SPECIFIC_PASSWORD
        # APPLE_TEAM_ID

    cache:
      cache_paths:
        - ~/.npm
        - .next/cache
        - ~/Library/Caches/electron
        - ~/Library/Caches/electron-builder

    scripts:
      - name: Install dependencies
        script: |
          set -euo pipefail

          node --version
          npm --version
          npm ci

      - name: Build Mac desktop app
        script: |
          set -euo pipefail

          signed_build=1
          missing_signing_vars=""

          append_missing_var() {
            if [ -z "$missing_signing_vars" ]; then
              missing_signing_vars="$1"
            else
              missing_signing_vars="$missing_signing_vars, $1"
            fi
          }

          if [ -z "${APPLE_ID:-}" ]; then
            append_missing_var "APPLE_ID"
          fi

          if [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            append_missing_var "APPLE_APP_SPECIFIC_PASSWORD"
          fi

          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            append_missing_var "APPLE_TEAM_ID"
          fi

          if [ -z "${CSC_LINK:-}" ] && [ -z "${CSC_NAME:-}" ]; then
            append_missing_var "CSC_LINK or CSC_NAME"
          fi

          if [ -n "${CSC_LINK:-}" ] && [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            append_missing_var "CSC_KEY_PASSWORD"
          fi

          if [ -z "$missing_signing_vars" ]; then
            export REQUIRE_MAC_SIGNING=true
            node scripts/verify-mac-signing-env.mjs
            npm run desktop:dist
          else
            signed_build=0
            export REQUIRE_MAC_SIGNING=false
            export ELECTRON_BUILDER_ALLOW_UNSIGNED_MAC=1
            unset CSC_LINK CSC_NAME CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_ID_PASSWORD APPLE_TEAM_ID
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER

            echo "Mac desktop signing is not configured; building unsigned development artifacts."
            echo "Missing: $missing_signing_vars"
            npm run desktop:dist:unsigned
          fi

          verified=0
          for app in dist-desktop/mac*/Fortified\ Command\ Center.app; do
            if [ -d "$app" ]; then
              if [ "$signed_build" -eq 1 ]; then
                codesign --verify --deep --strict --verbose=2 "$app"
                spctl --assess --type execute --verbose=4 "$app"
              else
                echo "Skipping Gatekeeper verification for unsigned app: $app"
              fi
              verified=1
            fi
          done

          if [ "$verified" -ne 1 ]; then
            echo "No packaged .app bundle found to verify."
            exit 1
          fi

          ls -lh dist-desktop

    artifacts:
      - dist-desktop/*.dmg
      - dist-desktop/*.zip
