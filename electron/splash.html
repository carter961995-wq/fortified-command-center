<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortified Command Center</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #060d1d;
        color: #e8eef9;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      .card {
        width: min(440px, calc(100vw - 48px));
        padding: 32px 28px 28px;
        border: 1px solid #1e3152;
        border-radius: 18px;
        background:
          radial-gradient(circle at 20% 0%, rgba(251, 146, 60, 0.22), transparent 42%),
          linear-gradient(180deg, #101d34, #081326 62%);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }
      .kicker {
        margin: 0 0 8px;
        color: #fdba74;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.1;
      }
      p {
        margin: 12px 0 0;
        color: #93a4c3;
        font-size: 14px;
        line-height: 1.45;
      }
      .bar {
        margin-top: 22px;
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #17243c;
      }
      .bar > span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, #f97316, #fdba74);
        animation: sweep 1.4s ease-in-out infinite;
      }
      .status {
        margin-top: 14px;
        color: #dbe7ff;
        font-size: 13px;
        font-weight: 700;
      }
      .detail,
      .error {
        margin-top: 8px;
        color: #7f93b5;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .error {
        color: #fdba74;
      }
      @keyframes sweep {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(280%);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="kicker">Fortified Fence &amp; Weld</p>
      <h1>Command Center</h1>
      <p>Starting the local dashboard. First launch can take a couple of minutes while Windows scans the app. Leave this window open.</p>
      <div class="bar" id="bar"><span></span></div>
      <p class="status" id="status">Starting local server…</p>
      <p class="detail" id="detail"></p>
    </main>
    <script>
      window.__setStatus = function setStatus(message, detail) {
        var status = document.getElementById("status");
        var detailEl = document.getElementById("detail");
        if (status) status.textContent = message || "";
        if (detailEl) {
          detailEl.textContent = detail || "";
          detailEl.className = /failed|error|timed out/i.test(String(message) + String(detail))
            ? "error"
            : "detail";
        }
      };
    </script>
  </body>
</html>
